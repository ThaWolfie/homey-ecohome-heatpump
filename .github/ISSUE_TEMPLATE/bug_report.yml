name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App version, Homey model and firmware
      placeholder: e.g. 0.1.5, Homey Pro (Early 2023), 12.4.0
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Heat pump model
  - type: textarea
    id: diagnostics
    attributes:
      label: Values from the cloud / Switches found in the cloud
      description: From the device settings. Never paste passwords or tokens.
      render: text
